<body>
<div class="shell">
<header><div class="brand"><span class="brand-mark" aria-hidden="true"></span>问知 <span class="eyebrow">QUESTION ATLAS</span></div><div class="header-actions"><span class="badge">本地探索样例 · 01</span><button id="exportBtn">导出记录 ↗</button></div></header>
<section class="hero"><div><div class="eyebrow" style="margin-bottom:10px">让阅读，沿着问题生长</div><h1>一个问题，可以有不止一种回答。</h1><p>从困惑出发，找到书中的观点。看清它们如何互补，也看清它们何时不适用。</p></div><div class="stats" id="stats"></div></section>
<nav class="presets" aria-label="探索预设"><button data-preset="all" aria-pressed="true">全部问题</button><button data-preset="econ" aria-pressed="false">从经济学看</button><button data-preset="system" aria-pressed="false">从系统看</button><button data-preset="judgment" aria-pressed="false">从判断过程看</button></nav>
<main class="workspace"><aside class="sidebar"><div class="side-top"><div class="tabs"><button data-mode="questions" aria-pressed="true">从问题出发</button><button data-mode="books" aria-pressed="false">从书出发</button></div><label class="screenreader" for="search">搜索问题、观点或书名</label><div class="search"><input id="search" type="search" placeholder="搜索问题、观点或书名…" autocomplete="off"></div><div class="side-meta"><span id="listLabel"></span><button id="clearBtn" style="font-size:11px;border:0;padding:0">清除筛选</button></div></div><div class="item-list" id="itemList"></div><div class="side-bottom"><button id="addBtn">＋ 放入我自己的问题</button></div></aside><div class="content"><div id="explorer"></div><details class="prompt" open><summary>把这个问题带回对话，继续探索</summary><p id="promptText"></p><div class="prompt-actions"><label class="screenreader" for="intent">下一步探索方式</label><select id="intent"><option value="compare">比较不同回答</option><option value="boundary">检查适用边界</option><option value="verify">寻找验证证据</option></select><button id="copyBtn">复制探索提示词</button></div></details></div></main>
<footer class="footer"><span>基于三本书的局部材料与作者访谈。问题和关联由我们整理，应用效果尚未验证。</span><span id="storageNote">自建问题保存在当前浏览器；换浏览器或清理数据前请导出。</span></footer>
</div>
<dialog id="addDialog" aria-labelledby="dialogTitle"><form id="addForm"><h2 id="dialogTitle">把你的问题放进来</h2><p class="muted small">先写下困惑，再选择可能有帮助的观点。关联会标记为“我的待验证关联”。</p><label for="newTitle">我想弄清楚什么？<input id="newTitle" type="text" maxlength="90" required placeholder="例如：为什么我们越催进度，返工反而越多？"></label><label for="newContext">具体场景（可选）<textarea id="newContext" maxlength="400" placeholder="写下目标、约束，或已经观察到的现象。"></textarea></label><label>哪些观点可能有帮助？（可多选，也可暂时不选）</label><div class="check-list" id="claimChoices"></div><div class="dialog-actions"><button type="button" id="cancelBtn">取消</button><button type="submit" class="primary">加入问题</button></div></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const books=[
 {id:'b1',title:'一课经济学',author:'Henry Hazlitt',en:'ECONOMICS IN ONE LESSON',color:'#c5d5b1',scope:'英文第一版重印本 · 作者序言与第 1、2 章',url:'https://www.ysu.am/sites/default/files/inline-files/1516005284-Henry%20Hazlitt%20Economics%20in%20One%20Lesson.pdf',location:'第 1 章 The Lesson；第 2 章 The Broken Window',note:'仅核对局部英文原文；没有核对你书架中的中译版本。这里不把书中政策判断当作普遍结论。'},
 {id:'b2',title:'第五项修炼',author:'Peter M. Senge',en:'THE FIFTH DISCIPLINE',color:'#e0ac91',scope:'出版社英文试读 · 第 1 章相关段落',url:'https://cdn.penguin.co.uk/dam-assets/books/9781905211203/9781905211203-sample.pdf',location:'Systems Thinking；Putting the Ideas into Practice（书内页 6–7、14–15）',note:'本样例只使用已核对的试读段落，不代表全书提炼，也没有覆盖全部系统原型。'},

];
const claims=[
 {id:'c1',book:'b1',title:'看收益，也看代价落在谁身上',text:'评估一项措施，应追踪不同群体所受的影响。',boundary:'遗漏检查不能代替效果测量，也不能直接决定不同人的利益应如何取舍。',action:'列出受益者、承担者和暂时没有被看见的人。',source:'原文转述 · 第 1 章'},
 {id:'c2',book:'b1',title:'眼前有效，还要检查后续影响',text:'短期影响与长期后果都应进入考量；也不能忽略眼前受损者。',boundary:'远期结果需要证据，不能用想象中的长期好处抵消已发生的损失。',action:'分别写出现在、随后和更长期需要观察的变化。',source:'原文转述 · 第 1 章'},
 {id:'c3',book:'b1',title:'被放弃的用途，也是成本',text:'破窗例子提示：修复所花的资源，原本可能满足其他需要。',boundary:'替代方案必须现实可行；不能把每个想得到的用途都累加成损失。',action:'写出不做当前方案时，资源最可能用于什么。',source:'原文转述 · 第 2 章'},
 {id:'c4',book:'b2',title:'看环节之间的关系',text:'孤立观察各个部分，可能遗漏相互关联的行动及其整体模式。',boundary:'相邻或同时变化不等于存在因果关系，连线需要事实支撑。',action:'沿着一个变化追问：它影响了哪个环节，又通过什么方式发生影响？',source:'原文转述 · Systems Thinking'},
 {id:'c5',book:'b2',title:'缓解症状，可能带来后续问题',text:'针对症状的干预，可能短暂见效，随后又需要更多干预。',boundary:'这是一种候选解释，不意味着临时措施总是错误；应检查替代原因。',action:'记录干预后发生的连续变化，检查问题是否转移或反复。',source:'原文转述 · Putting the Ideas into Practice'},
 {id:'c6',book:'b3',title:'判断中存在不希望出现的差异',text:'作者将噪声解释为判断中不希望出现的变异。',boundary:'信息、目标或价值取向不同带来的分歧，不能一律当成噪声。',action:'对齐材料和判断任务，再寻找差异来源。',source:'作者访谈转述'},
 {id:'c7',book:'b3',title:'先独立判断，再汇总讨论',text:'先保留各人的独立判断，再汇总，有助于避免过早趋同。',boundary:'独立不等于有能力；汇总也不保证正确，仍需检查证据和共同盲点。',action:'讨论前分别写下判断及依据，再比较不同理由。',source:'作者访谈转述'},

];

const questions=[
 {id:'q0',title:'通话变短了，客服效率真的提高了吗？',category:'system',kind:'演示场景',context:'目标暂定为：用更少总投入解决同等难度的问题，同时维持解决质量。',links:[link('c1','节省的时间可能转移到客户、后台或下一位客服。','补查遗漏'),link('c5','提前结束是否引发重复联系，需要检查后续路径。','机制假设'),link('c6','“已解决”的评估差异，可能影响对改进效果的判断。','检查评价')],next:'先比较同类问题的总处理时间、重复联系与解决质量。不要仅凭单次通话时长判断。'},
 {id:'q1',title:'一个方案让人受益，谁可能在承担代价？',category:'econ',kind:'材料提炼',context:'从已核对段落整理出的研究问题，并非作者原句。',links:[link('c1','检查观察范围里缺少哪些受影响的人。'),link('c3','除直接支出，还可能放弃了其他可行用途。')],next:'选一个具体方案，列出受影响的人和一个现实可行的替代方案。'},
 {id:'q2',title:'今天见效的办法，过一段时间还有效吗？',category:'econ',kind:'材料提炼',context:'短期结果不能独自说明后续效果；不同时间尺度需要分别观察。',links:[link('c2','扩展后果的时间范围。'),link('c5','尝试解释效果为何可能反转，但仍需核验。','补充机制')],next:'写下后续结果的预期、观察时点，以及什么现象会使你改变看法。'},
 {id:'q3',title:'做这件事时，我放弃了什么？',category:'econ',kind:'材料提炼',context:'以资源的替代用途为线索，而不是只看已经支付的费用。',links:[link('c3','帮助比较当前用途与最可行的替代用途。')],next:'只选一个最有可能实施的替代方案比较，避免堆积想象中的收益。'},
 {id:'q4',title:'每个环节都在改进，整体为何没有变好？',category:'system',kind:'材料提炼',context:'需要区分局部指标与整体目标，并检查环节之间的相互影响。',links:[link('c4','孤立部分的改善不代表关系结构已经改善。'),link('c1','另一种检查是：某一环节是否把代价转给其他环节。','互补检查')],next:'找一项明确的局部改变，追踪它对上下游的实际影响。'},
 {id:'q5',title:'问题解决过了，为什么又回来？',category:'system',kind:'材料提炼',context:'反复发生是线索，但还不是某种系统机制的证明。',links:[link('c5','检查干预是否只缓解了症状。'),link('c4','追踪不同环节是否共同维持了问题。')],next:'把每次干预和问题复现按时间排列，并保留至少一个竞争解释。'},
 {id:'q6',title:'同一份材料，为什么换个人评价就变了？',category:'judgment',kind:'材料提炼',context:'先确认人们是否在处理相同任务、使用相同信息与标准。',links:[link('c6','帮助识别不希望出现的判断差异。'),link('c7','先留下独立评价，才能看到真实分歧。'),link('c8','离散程度和共同偏离事实是两个检查方向。','区分误差')],next:'让评估者分别判断同一份匿名材料，比较理由而不只比较分数。'},
 {id:'q7',title:'会议很快达成共识，判断就更可靠吗？',category:'judgment',kind:'演示场景',context:'这是将作者访谈中的方法迁移到会议场景，效果尚未验证。',links:[link('c7','讨论前的独立记录可能暴露被过早共识掩盖的差异。','迁移假设'),link('c8','意见一致并不能排除共同方向的错误。')],next:'下一次讨论前先独立写下结论、依据和不确定性，再比较与会后结论的变化。'},
 {id:'q8',title:'意见不同，是噪声，还是有价值的分歧？',category:'judgment',kind:'材料提炼',context:'观点多样性与判断中不希望出现的变异，需要在具体任务中区分。',links:[link('c6','先检查信息、目标和标准是否一致。'),link('c8','不能把减少分歧直接等同于减少错误。')],next:'先解释一个分歧来自哪里，再决定要保留它、补信息还是统一标准。'},
 {id:'q9',title:'学更多方法，为什么还是不会解决问题？',category:'econ',kind:'演示场景',context:'这是为阅读任务构造的迁移问题，不是已核实的书中结论。',links:[link('c3','学习新方法占用的时间，可能替代了一次真实应用。','迁移假设'),link('c4','方法之间如何配合可能比各自数量更重要，仍需具体案例支持。','启发性类比')],next:'选一个眼前问题，比较继续阅读与用已有方法做一次尝试，各自预计带来什么信息。'},
 {id:'q10',title:'越催进度，为什么返工反而越多？',category:'system',kind:'演示场景',context:'先把它当待解释的现象，不预设催进度就是返工的原因。',links:[link('c5','检查短期赶工是否带来后续返工，同时排除任务难度等原因。','机制假设'),link('c2','分别观察当期完成量与后续修正成本。','互补检查')],next:'收集返工发生前的具体步骤，比较相近难度任务，先验证时间顺序与替代解释。'},
 {id:'q11',title:'指标变好了，怎样确认问题真的解决了？',category:'judgment',kind:'演示场景',context:'一个综合探索问题：观察范围、系统关系和评价过程都可能影响结论。',links:[link('c1','检查指标之外是否还有承担代价的人。','补查遗漏'),link('c4','检查其他环节是否出现了补偿性的变化。','追踪影响'),link('c6','检查改善是否来自评估口径或评估者变化。','检查评价')],next:'把目标结果和代理指标分开，写下一个“指标变好但目标未改善”的可观察例子。'}
];
const KEY='question-book-atlas-v1';
const state={mode:'questions',preset:'all',query:'',question:'q0',book:'b1',claim:'c1',intent:'compare',custom:[]};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bookBy=id=>books.find(b=>b.id===id),claimBy=id=>claims.find(c=>c.id===id);
const allQuestions=()=>[...questions,...state.custom];
let toastTimer;
function toast(s){$('#toast').textContent=s;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',3500)}
function restore(){try{const raw=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(raw)){state.custom=raw.filter(q=>q&&typeof q.id==='string'&&q.id.startsWith('u-')&&typeof q.title==='string'&&Array.isArray(q.links)).slice(0,100).map(q=>({id:q.id,title:q.title.slice(0,90),context:String(q.context||'').slice(0,400),category:'custom',kind:'我的问题',links:q.links.filter(l=>l&&claimBy(l.id)).map(l=>link(l.id,'由你手动选择，尚未补充支持材料。','我的待验证关联')),next:'补充具体案例与材料，再检查这些关联能否帮助判断。'}))}}catch{ $('#storageNote').textContent='本地记录暂不可读取；本次仍可探索和导出。' }}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state.custom));return true}catch{$('#storageNote').textContent='浏览器未能保存自建问题，请用“导出记录”保留本次内容。';return false}}
function textMatch(q){const text=[q.title,q.context,...q.links.map(l=>{const c=claimBy(l.id);return c.title+' '+c.text+' '+bookBy(c.book).title})].join(' ').toLowerCase();return text.includes(state.query.toLowerCase().trim())}
function filteredQuestions(){const bookFor={econ:'b1',system:'b2',judgment:'b3'};return allQuestions().filter(q=>(state.preset==='all'||q.links.some(l=>claimBy(l.id).book===bookFor[state.preset]))&&textMatch(q))}
function filteredBooks(){const matching=filteredQuestions();return books.filter(b=>{const bSearch=(b.title+' '+b.author+' '+b.scope).toLowerCase().includes(state.query.toLowerCase().trim());return (state.preset==='all'&&bSearch)||matching.some(q=>q.links.some(l=>claimBy(l.id).book===b.id))})}
function current(){return state.mode==='questions'?allQuestions().find(q=>q.id===state.question):bookBy(state.book)}
function selectQuestion(id){state.mode='questions';state.question=id;state.query='';state.preset='all';state.claim=allQuestions().find(q=>q.id===id)?.links[0]?.id||'';render()}
function selectBook(id){state.mode='books';state.book=id;state.query='';state.preset='all';state.claim=claims.find(c=>c.book===id)?.id||'';render()}
function render(){
 $('#stats').innerHTML=`<div><b>${allQuestions().length}</b><span>可探索的问题</span></div><div><b>${claims.length}</b><span>观点摘述</span></div><div><b>${books.length}</b><span>来源书籍</span></div>`;
 $('[data-mode="questions"]').setAttribute('aria-pressed',state.mode==='questions');$('[data-mode="books"]').setAttribute('aria-pressed',state.mode==='books');
 document.querySelectorAll('[data-preset]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.preset===state.preset));
 if($('#search').value!==state.query)$('#search').value=state.query;
 const list=state.mode==='questions'?filteredQuestions():filteredBooks();
 if(state.mode==='questions'&&!list.some(q=>q.id===state.question))state.question=list[0]?.id||'';
 if(state.mode==='books'&&!list.some(b=>b.id===state.book))state.book=list[0]?.id||'';
 $('#listLabel').textContent=`${list.length} ${state.mode==='questions'?'个问题':'本书'} · 点击探索`;
 $('#itemList').innerHTML=list.length?list.map(x=>state.mode==='questions'?`<button class="item ${x.id===state.question?'selected':''}" data-question="${esc(x.id)}" ${x.id===state.question?'aria-current="true"':''}><span class="item-title">${esc(x.title)}</span><span class="item-meta"><span>${esc(x.kind)}</span><span>${x.links.length} 个观点 · ${new Set(x.links.map(l=>claimBy(l.id).book)).size} 本书</span></span></button>`:`<button class="item ${x.id===state.book?'selected':''}" data-book="${x.id}" ${x.id===state.book?'aria-current="true"':''}><span class="item-title">《${x.title}》</span><span class="item-meta"><span>${claims.filter(c=>c.book===x.id).length} 个观点</span><span>${allQuestions().filter(q=>q.links.some(l=>claimBy(l.id).book===x.id)).length} 个问题</span></span></button>`).join(''):'<div class="empty">没有找到匹配内容。<br>试试“代价”“评价”或书名，<br>也可以清除筛选。</div>';
 const item=current();if(!item){$('#explorer').innerHTML='<section class="book-overview"><h2>暂时没有匹配的内容</h2><p class="muted" style="margin-top:12px">清除筛选，或把这个新问题加入你的探索。</p></section>';updatePrompt();return}
 if(state.mode==='questions')renderQuestion(item);else renderBook(item);
 updatePrompt();requestAnimationFrame(drawEdges);
}
function detailHtml(c){const b=bookBy(c.book);return `<article class="detail" aria-label="观点详情"><div class="row"><span class="eyebrow">观点详情</span><span class="badge orange">${esc(c.source)}</span></div><h3>${esc(c.title)}</h3><div class="quote">${esc(c.text)}</div><dl><div class="field"><dt>由我们提炼的思考动作</dt><dd>${esc(c.action)}</dd></div><div class="field"><dt>使用边界 · 我们的提醒</dt><dd>${esc(c.boundary)}</dd></div></dl><div class="source-box"><button data-book="${b.id}" style="padding:0;border:0;color:var(--blue);font-size:13px">来自《${b.title}》 ↗</button><p>${esc(b.location)}</p><p>${esc(b.note)}</p><p><a href="${esc(b.url)}" target="_blank" rel="noopener noreferrer">查看已核对的来源 ↗</a></p></div></article>`}
function renderQuestion(q){
 if(!q.links.some(l=>l.id===state.claim))state.claim=q.links[0]?.id||'';
 const cs=q.links.map(l=>claimBy(l.id)),bs=books.filter(b=>cs.some(c=>c.book===b.id));
 const isDemo=q.kind==='演示场景'||q.kind==='我的问题';
 $('#explorer').innerHTML=`<section class="focus-head"><div class="focus-meta"><span class="eyebrow">当前探索 / QUESTION</span><span class="badge ${isDemo?'orange':'green'}">${esc(q.kind)}</span></div><h2>${esc(q.title)}</h2><p>${esc(q.context||'你新加入的问题，等待补充情境和材料。')}</p></section><section class="map-panel" aria-label="问题观点书籍关系图"><div class="legend"><span><i class="dot"></i>问题</span><span><i class="dot orange"></i>观点</span><span><i class="dot blue"></i>书籍</span><span>虚线：我们的关联判断 · 实线：来源归属</span></div>${cs.length?`<div class="map-scroll"><div class="map" id="map"><svg aria-hidden="true"></svg><div class="map-col"><span class="column-label">从这里出发</span><div class="node" data-node="${esc(q.id)}"><span class="node-type">当前问题</span>${esc(q.title)}</div></div><div class="map-col"><span class="column-label">找到相关观点</span>${cs.map(c=>`<button class="node claim ${c.id===state.claim?'selected':''}" data-claim="${c.id}" data-node="${c.id}" aria-pressed="${c.id===state.claim}"><span class="node-type">${esc(q.links.find(l=>l.id===c.id).role)}</span>${esc(c.title)}</button>`).join('')}</div><div class="map-col"><span class="column-label">回到书的出处</span>${bs.map(b=>`<button class="node book" data-book="${b.id}" data-node="${b.id}"><span class="node-type">来源书籍</span>《${b.title}》<small>${b.id==='b3'?'作者访谈':'局部原文'}</small></button>`).join('')}</div></div></div><p class="map-help">点观点看边界与出处；点书查看它还能帮助探索哪些问题。</p>`:'<div class="empty">这个问题还没有关联观点。可以先回到书中寻找材料，避免为了连线而连线。</div>'}</section>${cs.length?`<div class="below">${detailHtml(claimBy(state.claim))}<article class="relations"><div class="eyebrow">为什么连在一起</div><h3 style="margin-top:9px">每条连接，都应有理由。</h3><p class="small muted" style="margin-top:7px">以下均为我们的关联判断，应用效果未验证。</p>${q.links.map(l=>`<div class="relation"><button data-claim="${l.id}">${esc(claimBy(l.id).title)} ↗</button><p>${esc(l.why)}</p><p><span class="badge">${esc(l.role)}</span></p></div>`).join('')}</article></div>`:''}<section class="next-step"><div class="step-icon">↗</div><div><div class="eyebrow">把理解向前推进一步</div><p>${esc(q.next)}</p></div></section>`;
}
function renderBook(b){const cs=claims.filter(c=>c.book===b.id);if(!cs.some(c=>c.id===state.claim))state.claim=cs[0].id;const qs=allQuestions().filter(q=>q.links.some(l=>claimBy(l.id).book===b.id));$('#explorer').innerHTML=`<article class="book-overview"><div class="eyebrow">从一本书，找到多个问题 / BOOK</div><div class="book-grid"><div class="cover" style="background:${b.color}"><b>${b.title}</b><span>${b.en}</span></div><div><h2>《${b.title}》</h2><p class="muted small" style="margin:8px 0 13px">${b.author}</p><span class="badge green">${cs.length} 个观点 · ${qs.length} 个关联问题</span><p class="desc" style="margin-top:14px">${b.scope}</p><p class="desc">${b.note}</p></div></div><div class="book-claims">${cs.map(c=>`<button data-claim="${c.id}" class="${state.claim===c.id?'active':''}">${c.title}<small>${c.source}</small></button>`).join('')}</div><div class="book-questions"><h3>这本书与哪些问题相连？</h3>${qs.map(q=>`<button data-question="${esc(q.id)}">${esc(q.title)}<span>探索 →</span></button>`).join('')}</div></article><div class="book-detail-extra">${detailHtml(claimBy(state.claim))}</div>`}
function drawEdges(){const map=$('#map');if(!map)return;const q=current();if(state.mode!=='questions'||!q)return;const box=map.getBoundingClientRect();const svg=map.querySelector('svg');svg.setAttribute('viewBox',`0 0 ${box.width} ${box.height}`);const point=(id,right)=>{const n=map.querySelector(`[data-node="${CSS.escape(id)}"]`);const r=n.getBoundingClientRect();return {x:(right?r.right:r.left)-box.left,y:r.top+r.height/2-box.top}};const path=(from,to,dashed,active)=>{const a=point(from,true),b=point(to,false),mid=(a.x+b.x)/2;return `<path d="M ${a.x} ${a.y} C ${mid} ${a.y}, ${mid} ${b.y}, ${b.x} ${b.y}" fill="none" stroke="${active?'#c0b18d':'#4b6060'}" stroke-width="${active?1.8:1.2}" ${dashed?'stroke-dasharray="4 5"':''}/><circle cx="${b.x}" cy="${b.y}" r="2.5" fill="${active?'#efbd90':'#678384'}"/>`};svg.innerHTML=q.links.map(l=>path(q.id,l.id,true,l.id===state.claim)+path(l.id,claimBy(l.id).book,false,l.id===state.claim)).join('')}
function updatePrompt(){const item=current();const output=$('#promptText');$('#copyBtn').disabled=!item;$('#intent').disabled=!item;if(!item){output.textContent='选一个问题或一本书后，这里会生成可复制的探索提示词。';return}const modes={compare:'请比较这些观点分别能回答哪一部分，哪些互补、哪些不能直接套用。',boundary:'请检查这些观点的适用条件，并给出会让关联失效的反例。',verify:'请说明需要补充什么证据，以及怎样用一个小观察区分竞争解释。'};let content;if(state.mode==='questions'){const q=item;const descriptions=q.links.map(l=>{const c=claimBy(l.id);return `《${bookBy(c.book).title}》的“${c.title}”`}).join('；');content=`我想研究：“${q.title}”。${q.context?'情境：'+q.context+'\n':''}${descriptions?'目前关联的观点是：'+descriptions+'。\n':'目前尚未关联书中观点，请先帮助定位可用材料。\n'}${modes[state.intent]}`;}else{const c=claimBy(state.claim);content=`我想围绕《${item.title}》的“${c.title}”继续探索。当前材料范围：${item.scope}。请找出它能帮助回答的具体问题，并与其他方法比较。${modes[state.intent]}`;}output.textContent=content+'\n请区分作者主张、我们的推断和实际证据；不要编造引文或页码。'}
function reset(){state.preset='all';state.query='';render()}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.question){selectQuestion(el.dataset.question);return}if(el.dataset.book){selectBook(el.dataset.book);return}if(el.dataset.claim){state.claim=el.dataset.claim;render();return}if(el.dataset.preset){state.preset=el.dataset.preset;state.query='';state.mode='questions';render();return}if(el.dataset.mode){state.mode=el.dataset.mode;render()}});
$('#search').addEventListener('input',e=>{state.query=e.target.value;render()});$('#clearBtn').addEventListener('click',reset);$('#intent').addEventListener('change',e=>{state.intent=e.target.value;updatePrompt()});
$('#copyBtn').addEventListener('click',async()=>{const text=$('#promptText').textContent;try{await navigator.clipboard.writeText(text);toast('探索提示词已复制')}catch{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.left='-9999px';document.body.append(t);t.select();const ok=document.execCommand('copy');t.remove();toast(ok?'探索提示词已复制':'请选中提示词文字，手动复制')}});
$('#addBtn').addEventListener('click',()=>{$('#addForm').reset();$('#claimChoices').innerHTML=claims.map(c=>`<label><input type="checkbox" name="claim" value="${c.id}"><span>${c.title}<small>《${bookBy(c.book).title}》</small></span></label>`).join('');$('#addDialog').showModal();$('#newTitle').focus()});$('#cancelBtn').addEventListener('click',()=>$('#addDialog').close());
$('#addForm').addEventListener('submit',e=>{e.preventDefault();const title=$('#newTitle').value.trim();if(!title){$('#newTitle').focus();return}if(state.custom.length>=100){toast('样例最多保留 100 个自建问题，请先导出记录。');return}const ids=[...$('#claimChoices').querySelectorAll('input:checked')].map(i=>i.value);const q={id:'u-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),title,context:$('#newContext').value.trim(),category:'custom',kind:'我的问题',links:ids.map(id=>link(id,'由你手动选择，尚未补充支持材料。','我的待验证关联')),next:'补充具体案例与材料，再检查这些关联能否帮助判断。'};state.custom.push(q);const saved=persist();$('#addDialog').close();selectQuestion(q.id);toast(saved?'问题已加入，并保存在当前浏览器':'问题已加入；本地保存失败，请导出保留')});
$('#exportBtn').addEventListener('click',()=>{const data={version:1,exportedAt:new Date().toISOString(),scope:'局部材料探索样例；关联与应用未验证',books,claims,questions:allQuestions(),customQuestions:state.custom};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='问知-问题与书籍记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('记录已导出，可保留或交给后续工具处理')});
window.addEventListener('resize',()=>requestAnimationFrame(drawEdges));restore();render();
</script>
</body></html>
